[package]
name = "pawpal"
version = "1.2.0"
edition = "2021"
description = "A free, realistic desktop pet that lives on your Dock or taskbar."

[[bin]]
name = "pawpal"
path = "src/main.rs"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
femtovg = { version = "0.27", default-features = false }
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
# ksni talks to the Linux tray over D-Bus, so no GTK is needed.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
# Shared pets are zip files; the frames inside are PNGs already, so they are stored, not compressed.
zip = { version = "9", default-features = false }
global-hotkey = "0.9"
rrule = "0.14"
chrono = "0.4"
chrono-tz = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "EKEventStore", "EKEvent", "EKCalendarItem", "EKObject", "EKTypes", "EKCalendar", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSArray", "NSDictionary", "NSValue", "NSGeometry", "NSDate", "NSBundle", "NSError", "NSData", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSView", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSResponder", "NSGraphics", "NSApplication", "NSImage", "NSAlert", "NSButton", "NSControl"] }
core-foundation = "0.10"
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }

[profile.release]
lto = true
strip = true

# Debian package for the Linux release (`cargo deb`).
[package.metadata.deb]
maintainer = "anggiedwarsa <anggiedwarsa@gmail.com>"
section = "games"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg, zenity"
extended-description = "Import short clips of your own cat; PawPal cuts it out of the background and it walks, naps and plays on your taskbar."
assets = [
    ["target/release/pawpal", "usr/bin/", "755"],
    ["packaging/linux/pawpal.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/pixmaps/pawpal.png", "644"],
    ["README.md", "usr/share/doc/pawpal/README", "644"],
]
