[package]
name = "pawpal"
version = "1.0.0"
edition = "2021"
description = "A free, realistic desktop pet that lives on your Dock or taskbar."

[[bin]]
name = "pawpal"
path = "src/main.rs"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
femtovg = { version = "0.27", default-features = false }
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
# ksni talks to the Linux tray over D-Bus, so no GTK is needed.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSArray", "NSDictionary", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSView", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSResponder", "NSGraphics", "NSApplication"] }
core-foundation = "0.10"
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }

[profile.release]
lto = true
strip = true
